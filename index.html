
<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Dashboard</h2>
        <a href="#">Home</a>
        <a href="#">Analytics</a>
        <a href="#">Orders</a>
        <a href="#">Settings</a>
    </div>

    <div class="main">
        <h1>Welcome to Dashboard</h1>

        <div class="cards">
            <div class="card">
                <h3>Users</h3>
                <p>1200</p>
            </div>

            <div class="card">
                <h3>Sales</h3>
                <p>$5000</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>250</p>
            </div>
        </div>

        <h2>Sales Chart</h2>
        <div class="chart">
            <div style="height:60%"></div>
            <div style="height:80%"></div>
            <div style="height:40%"></div>
            <div style="height:100%"></div>
            <div style="height:70%"></div>
        </div>

        <h2>Recent Orders</h2>

        <table>
            <tr>
                <th>Name</th>
                <th>Product</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>Ali</td>
                <td>Laptop</td>
                <td>$500</td>
            </tr>
            <tr>
                <td>Ahmed</td>
                <td>Mobile</td>
                <td>$300</td>
            </tr>
            <tr>
                <td>Sara</td>
                <td>Keyboard</td>
                <td>$50</td>
            </tr>
        </table>

        <button onclick="showMessage()">Click Me</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
